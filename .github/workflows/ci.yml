# Runs on every push/PR: vet/build/test (linux, macOS), golangci-lint, and
# govulncheck. Separate from release.yml, which only builds and publishes
# tagged binaries.
#
# go-version is pinned to Go 1.26.8, the current patched release. Keep this
# explicit: a minor-only selector can resolve an older vulnerable patch and
# leave govulncheck reporting already-fixed standard-library CVEs. Advance this
# pin as supported 1.26 patches are released.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [[ -n "$fmt_out" ]]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
