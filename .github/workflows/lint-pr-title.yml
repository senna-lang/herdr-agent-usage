# Lints the pull request title against the Conventional Commits spec.
#
# Runs `amannn/action-semantic-pull-request@v6` (used by Electron, Vite,
# Excalidraw, Apache, Vercel, Microsoft, Firebase, AWS — 1.3k+ stars).
# On failure the PR check goes red with a message describing which rule
# was violated. The action emits `type` / `scope` / `subject` outputs that
# downstream jobs (e.g. release-please) can consume.
#
# Trigger notes:
#   - `pull_request_target` is required so the check still runs on PRs from
#     forks; the action uses the workflow from the base branch, which keeps
#     secrets out of the fork's context.
#   - `synchronize` is included so the check re-runs on every push; omit it
#     only if you do not mark this as a required status check.
#
# Known asymmetries between this action and .commitlint.yaml (both verified
# against commitlint-go v0.12.0 source, not just its README):
#   - Length: this action enforces no title-length rule at all, while
#     .commitlint.yaml sets header-min-length 10 / header-max-length 72
#     (measured in BYTES). `fix: typo` (9 bytes) passes here and is
#     rejected by the local hook; a 90-byte title does the opposite.
#   - Scope charset: commitlint-go enables no scope rule, so any rune except
#     newline/parens passes locally (e.g. `feat(データ層): ...`). This
#     action's default headerPattern restricts the scope to `[\w$.\-*/ ]`,
#     which is ASCII-only, so a non-ASCII scope fails here but passes
#     locally. An uppercase ASCII scope such as `feat(API): ...` passes
#     BOTH tools (`\w` includes A-Z; commitlint-go has no charset rule).
# Net effect: passing here does not guarantee passing locally, and vice
# versa. Treat the local hook as the stricter, authoritative check.
name: Lint PR title

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Same type list as .commitlint.yaml (settings.type-enum.argument).
          # The action compares the extracted type against this list, and
          # commitlint-go enforces the same lower-case-only enum via the
          # case-sensitive `type-enum` rule, so the two stay consistent.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert